# Watson configuration (copy to config.yaml — never commit config.yaml)
server:
  port: 3000
  host: "0.0.0.0"

session:
  ttl_days: 30

llm:
  provider: openai
  # api_key: set via LLM_API_KEY in .env
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini

preferences:
  timezone: Asia/Shanghai
  due_soon_days: 7
